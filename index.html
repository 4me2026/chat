<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
remove,
get,
onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyDzVDvWB8RWm-O47n-rSjXg34j8__7atQ4",
authDomain: "chat2026-c1fad.firebaseapp.com",
databaseURL: "https://chat2026-c1fad-default-rtdb.firebaseio.com",
projectId: "chat2026-c1fad",
storageBucket: "chat2026-c1fad.firebasestorage.app",
messagingSenderId: "702521438577",
appId: "1:702521438577:web:d52c0a01552068ad5a06d0",
measurementId: "G-D6QPE4KPCZ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username = "";
let isAdmin = false;
let userRef = null;
let isUserActive = true;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

// ألوان مختلفة لكل عضو
const userColors = {};
const colorPalette = [
"#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7",
"#DDA0DD", "#98D8C8", "#F7DC6F", "#BB8FCE", "#85C1E9",
"#F8C471", "#82E0AA", "#F1948A", "#85929E", "#73C6B6",
"#E59866", "#AF7AC5", "#5DADE2", "#58D68D", "#F4D03F"
];
let colorIndex = 0;

function getUserColor(name) {
    if (!userColors[name]) {
        userColors[name] = colorPalette[colorIndex % colorPalette.length];
        colorIndex++;
    }
    return userColors[name];
}

// تحويل الملف إلى Base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

// رفع الملفات (تخزين كـ Base64 في قاعدة البيانات)
async function uploadFile(file) {
    try {
        const maxSize = 5 * 1024 * 1024; // 5 ميجابايت
        if (file.size > maxSize) {
            alert("❌ حجم الملف كبير جداً. الحد الأقصى 5 ميجابايت.");
            return;
        }

        // عرض رسالة تحميل
        const box = document.getElementById("messages");
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "msg uploading-msg";
        loadingDiv.id = "uploadingMsg";
        loadingDiv.innerHTML = `
            <span class="name">${username}</span>
            <div>
                <span class="upload-spinner"></span>
                ⏳ جاري رفع ${file.type.startsWith('image/') ? 'الصورة' : 'الملف'}: ${file.name}
            </div>
        `;
        box.appendChild(loadingDiv);
        box.scrollTop = 0;

        // تحويل الملف إلى Base64
        const base64Data = await fileToBase64(file);
        
        // تحديد نوع الملف
        let type = "file";
        let html = "";
        
        if (file.type.startsWith("image/")) {
            type = "image";
            html = `<img src="${base64Data}" class="msg-image" onclick="window.open('${base64Data}','_blank')">`;
        } else if (file.type.startsWith("audio/")) {
            type = "audio";
            html = `<audio controls class="msg-audio"><source src="${base64Data}"></audio>`;
        } else if (file.type.startsWith("video/")) {
            type = "video";
            html = `<video controls class="msg-image" style="max-height:300px;"><source src="${base64Data}"></video>`;
        } else {
            type = "file";
            html = `<a href="${base64Data}" download="${file.name}" target="_blank" class="msg-file">📄 ${file.name}</a>`;
        }
        
        // حذف رسالة التحميل
        const uploadingEl = document.getElementById("uploadingMsg");
        if (uploadingEl) uploadingEl.remove();
        
        // إرسال الرسالة مع الملف
        await push(ref(db,"messages"), {
            name: username,
            owner: username,
            text: html,
            type: type,
            fileName: file.name,
            fileData: base64Data,
            time: new Date().toLocaleString('ar-SA')
        });
        
    } catch (error) {
        console.error("خطأ في رفع الملف:", error);
        alert("❌ حدث خطأ أثناء رفع الملف: " + error.message);
        const uploadingEl = document.getElementById("uploadingMsg");
        if (uploadingEl) uploadingEl.remove();
    }
}

// بدء التسجيل الصوتي
async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        
        mediaRecorder.ondataavailable = event => {
            audioChunks.push(event.data);
        };
        
        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioFile = new File([audioBlob], `تسجيل_${new Date().toLocaleTimeString('ar-SA')}.webm`, { type: 'audio/webm' });
            await uploadFile(audioFile);
            
            // إيقاف المسارات
            stream.getTracks().forEach(track => track.stop());
        };
        
        mediaRecorder.start();
        isRecording = true;
        document.getElementById("recordBtn").textContent = "⏹️";
        document.getElementById("recordBtn").classList.add("recording");
        
    } catch (error) {
        console.error("خطأ في بدء التسجيل:", error);
        alert("❌ لا يمكن الوصول إلى الميكروفون. تأكد من منح الإذن.");
    }
}

// إيقاف التسجيل
function stopRecording() {
    if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById("recordBtn").textContent = "🎤";
        document.getElementById("recordBtn").classList.remove("recording");
    }
}

function renderMessages(snapshot){

const box = document.getElementById("messages");

const messages = [];
snapshot.forEach(child => {
messages.push({
key: child.key,
data: child.val()
});
});

messages.sort((a, b) => b.key.localeCompare(a.key));

box.innerHTML = "";

messages.forEach(({key, data}) => {
let delBtn = "";

if(data.owner === username || isAdmin){
delBtn = `<button class="deleteBtn" onclick="deleteMessage('${key}')">حذف</button>`;
}

const div = document.createElement("div");
div.className="msg";

const userColor = getUserColor(data.name);

div.style.backgroundColor = userColor + "33";
div.style.borderRight = "4px solid " + userColor;

let content = data.text || "";

div.innerHTML=`
<span class="name" style="color:${userColor};">${data.name}</span>
<div>${content}</div>
<span class="time">${data.time}</span>
${delBtn}
`;

box.appendChild(div);

});

if (messages.length > 0) {
box.scrollTop = 0;
}

}

// عرض المتصلين الحاليين فقط
function renderOnlineUsers(snapshot) {
const now = Date.now();
const ONLINE_TIMEOUT = 60000; // 60 ثانية
const onlineUsers = [];

snapshot.forEach(child => {
const data = child.val();
const key = child.key;
const lastSeen = data.lastSeen || parseInt(key);
const age = now - lastSeen;
const status = data.status || "offline";

// فقط المستخدمين المتصلين حالياً
const isOnline = (status === "online" && age < ONLINE_TIMEOUT) || age < 30000;

if (isOnline) {
onlineUsers.push({
name: data.name,
lastSeen: lastSeen
});
}
});

const onlineUsersDiv = document.getElementById("onlineUsers");
const onlineCount = document.getElementById("onlineCount");

// تحديث العدد
onlineCount.textContent = `👥 المتصلون الآن: ${onlineUsers.length}`;

let html = '';

// عرض المتصلين الحاليين فقط
onlineUsers.forEach(user => {
html += `
<span class="online-user">
<span class="status-dot"></span>
<span class="user-name">${user.name}</span>
<span class="user-status-text">🟢 متصل الآن</span>
</span>
`;
});

onlineUsersDiv.innerHTML = html || '<span class="no-users">👤 لا يوجد متصلين حالياً</span>';
}

// تنظيف المستخدمين غير النشطين (أكثر من دقيقتين)
function cleanupInactiveUsers() {
const now = Date.now();
const INACTIVE_TIMEOUT = 2 * 60 * 1000; // دقيقتين

const onlineRef = ref(db, "online");
get(onlineRef).then((snapshot) => {
if (snapshot.exists()) {
snapshot.forEach((child) => {
const data = child.val();
const lastSeen = data.lastSeen || parseInt(child.key);
const age = now - lastSeen;

// حذف إذا كان غير نشط لأكثر من دقيقتين
if (age > INACTIVE_TIMEOUT) {
remove(ref(db, "online/" + child.key));
}
});
}
}).catch((error) => {
console.error("خطأ في تنظيف المستخدمين غير النشطين:", error);
});
}

// الاستماع للتغييرات في الرسائل
onValue(ref(db,"messages"), (snapshot)=>{
renderMessages(snapshot);
});

// الاستماع للتغييرات في المتصلين
onValue(ref(db,"online"), (snapshot)=>{
renderOnlineUsers(snapshot);
});

// تنظيف المستخدمين غير النشطين كل 30 ثانية
setInterval(cleanupInactiveUsers, 30000);
// تشغيل التنظيف فوراً بعد 3 ثواني
setTimeout(cleanupInactiveUsers, 3000);
